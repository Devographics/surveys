          hasSponsor: true
          customizationModes:
            - filters
          queryOptions:
            questionId: _items
            addBuckets: false
            addRatios: true
            addQuestionEntity: true
            allEditions: true
            addQuestionComments: false
            sectionId: _all_features
          parameters:
            cutoffPercent: 0
            facetCutoffPercent: 0
            limit: 0
          query: |
            surveys {
              state_of_css {
                css2026 {
                  _all_features {
                    features_ratios_over_time: _items {
                      id
                      entity {
                        name
                        nameClean
                        nameHtml
                        alias
                        entityType
                        description
                        descriptionClean
                        descriptionHtml
                        homepage {
                          url
                        }
                        caniuse {
                          name
                          url
                        }
                        mdn {
                          locale
                          url
                          title
                          summary
                        }
                        example {
                          label
                          language
                          code
                          codeHighlighted
                        }
                      }
                      responses(facet: _sentiment) {
                        allEditions {
                          year
                          editionId
                          ratios {
                            awareness
                            interest
                            usage
                            retention
                            positivity
                            positivityRelative
                            appreciation
                          }
                          completion {
                            count
                            percentageSurvey
                            total
                          }
                          buckets {
                            id
                            count
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          name: multi_items_ratios
          template: multi_items_ratios
