          id: figure_total_features
          template: figure
          variables:
            value: 46
            unit: count
          isMainBlock: true
          path: /features/figure_total_features/
          sectionId: features
    - id: all_features
      variants:
        - id: all_features
          blockType: MultiItemsExperienceBlock
          hasSponsor: true
          customizationModes:
            - filters
          queryOptions:
            questionId: _items
            addBuckets: true
            addRatios: true
            addQuestionEntity: true
            allEditions: false
            sectionId: _all_features
          parameters:
            cutoff: 1
            cutoffPercent: 0
            facetCutoffPercent: 0
            limit: 0
          query: |
            surveys {
              state_of_css {
                css2026 {
                  _all_features {
                    all_features: _items {
                      id
                      _metadata {
                        sectionId
                      }
                      entity {
                        name
                        nameClean
                        nameHtml
                        alias
                        entityType
                        description
                        descriptionClean
                        descriptionHtml
                        homepage {
                          url
                        }
                        caniuse {
                          name
                          url
                        }
                        mdn {
                          locale
                          url
                          title
                          summary
                        }
                        example {
                          label
                          language
                          code
                          codeHighlighted
                        }
                        resources {
                          title
                          url
                        }
                        webFeature {
                          id
                          description_html
                          group
                          name
                          spec
                          url
                          status {
                            baseline
                            baseline_low_date
                            support {
                              chrome
                              chrome_android
                              edge
                              firefox
                              firefox_android
                              safari
                              safari_ios
                            }
                          }
                        }
                      }
                      comments {
                        currentEdition {
                          count
                        }
                      }
                      responses(facet: _sentiment, parameters: {cutoff: 1, limit: 0}) {
                        currentEdition {
                          ratios {
                            awareness
                            interest
                            usage
                            retention
                            positivity
                            positivityRelative
                          }
                          buckets {
                            count
                            id
                            facetBuckets {
                              count
                              id
                              percentageBucket
                              percentageQuestion
                              percentageSurvey
                            }
                            percentageQuestion
                            percentageSurvey
                          }
                          completion {
                            count
                            percentageSurvey
                            total
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          name: multi_items_experience
          template: multi_items_experience
          i18nNamespace: features
          chartOptions:
            limit: 5
            categories:
              - layout
              - shapes_graphics
              - colors
              - interactions
              - other_features
          isMainBlock: true
          path: /features/all_features/
          sectionId: features
    - id: figure_sibling_count_awareness
